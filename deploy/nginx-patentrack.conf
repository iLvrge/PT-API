# nginx for PatenTrack: TLS termination, the two React bundles as static
# files, and a reverse proxy to the API on loopback.
#
#   /etc/nginx/sites-available/patentrack  ->  ln -s ../sites-available/patentrack /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The API listens on 127.0.0.1 only (see PORT / the listen call in
# src/server.js) so nothing reaches it except through here.

# --- shared --------------------------------------------------------------

# Rate limiting lives in the app (express-rate-limit, per route class). This
# zone is a blunt second line for the whole vhost, sized well above the app's
# own limits so it only catches something pathological.
limit_req_zone $binary_remote_addr zone=patentrack:10m rate=50r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream patentrack_api {
  server 127.0.0.1:3600;
  keepalive 32;          # reuse connections; the API is behind loopback
}

server {
  listen 80;
  listen [::]:80;
  server_name app.patentrack.com admin.patentrack.com api.patentrack.com;
  # ACME needs plain HTTP; everything else goes to TLS.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# --- the API -------------------------------------------------------------

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.patentrack.com;

  ssl_certificate     /etc/letsencrypt/live/api.patentrack.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.patentrack.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  # The app sets its own CSP, HSTS, X-Frame-Options and so on through helmet.
  # Do not duplicate them here — two sources for one header is how they drift.

  client_max_body_size 25m;   # >= FILE_UPLOAD_MAX_MB, else nginx 413s first
  limit_req zone=patentrack burst=100 nodelay;

  # Long enough for the slowest reports. Anything past this is a bug to fix,
  # not a timeout to raise.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  location / {
    proxy_pass http://patentrack_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    # TRUST_PROXY_HOPS must equal the number of proxies that append here — 1
    # for this file. Setting it higher lets a caller forge their own IP and
    # walk around the rate limiter.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Correlates an nginx line with the app's own `requestId`.
    proxy_set_header X-Request-Id      $request_id;
  }

  # Probes: no rate limit, no access log noise.
  location = /health       { proxy_pass http://patentrack_api; access_log off; }
  location = /health/ready { proxy_pass http://patentrack_api; access_log off; }

  access_log /var/log/nginx/patentrack-api.access.log;
  error_log  /var/log/nginx/patentrack-api.error.log warn;
}

# --- the customer front end ---------------------------------------------

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name app.patentrack.com;

  ssl_certificate     /etc/letsencrypt/live/app.patentrack.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.patentrack.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /srv/patentrack/app;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite fingerprints every asset, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or a deploy ships new assets to a browser
  # still holding the old entry point.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Client-side routing: every unknown path is the SPA.
  location / { try_files $uri $uri/ /index.html; }

  access_log /var/log/nginx/patentrack-app.access.log;
}

# --- the admin console ---------------------------------------------------

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name admin.patentrack.com;

  ssl_certificate     /etc/letsencrypt/live/admin.patentrack.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.patentrack.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /srv/patentrack/admin;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html { add_header Cache-Control "no-store, must-revalidate"; }
  location / { try_files $uri $uri/ /index.html; }

  access_log /var/log/nginx/patentrack-admin.access.log;
}
